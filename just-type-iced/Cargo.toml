[package]
name = "just-type-iced"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "just-type-iced"

[[bin]]
name = "just-type"
path = "src/main"

[dependencies]
directories = "6.0.0"
iced = { version = "0.14.0", features = ["advanced", "tokio", "svg"] }
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }

[dev-dependencies]
rstest = "0.28.0"
